name: BlackLabelTrading
options:
  deploymentTarget: { macOS: "13.0" }
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 745ZPGFRA5
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: "Black Label Trading"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  BlackLabelTrading:
    type: application
    platform: macOS
    sources: [ { path: Sources } ]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.blacklabel.trading
        CODE_SIGN_ENTITLEMENTS: Sources/app.entitlements
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: "Black Label Trading"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "13.0"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.finance
        NSHumanReadableCopyright: "© 2026 Black Label. All rights reserved."
        GoogleClientID: ""
        CFBundleURLTypes:
          - CFBundleURLSchemes: ["com.blacklabel.trading"]
